<!DOCTYPE html>
<html>
<head>
    <title>Registro de Coleccionista - Álbum Web Selección Argentina</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="header">
        <h1>Registro de Coleccionista 🇦🇷</h1>
        <a href="index.html" class="boton-interactivo">Volver al Álbum</a>
    </div>

    <div class="seccion-registro">
        <h2>Formulario de Registro</h2>
        <p>Completá tus datos para sumarte a la comunidad de coleccionistas.</p>

        <form method="GET" autocomplete="off">

            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresá tu nombre" required><br><br>

            <label for="apellido">Apellido:</label><br>
            <input type="text" id="apellido" name="apellido" placeholder="Ingresá tu apellido" required><br><br>

            <label for="email">Correo Electrónico:</label><br>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required><br><br>

            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" placeholder="Ingresá una contraseña" required><br><br>

            <label for="edad">Edad:</label><br>
            <input type="number" id="edad" name="edad" min="6" max="99" required><br><br>

            <p><strong>Categoría de Álbum Preferido:</strong></p>
            <input type="radio" id="categoria-inicial" name="categoria" value="Album Inicial">
            <label for="categoria-inicial">Álbum Inicial</label><br>
            <input type="radio" id="categoria-avanzado" name="categoria" value="Album Avanzado">
            <label for="categoria-avanzado">Álbum Avanzado</label><br>
            <input type="radio" id="categoria-legendaria" name="categoria" value="Album Legendaria">
            <label for="categoria-legendaria">Álbum Legendaria</label><br><br>

            <p><strong>Temáticas de Interés:</strong></p>
            <input type="checkbox" id="tema-futbol" name="temas" value="Futbol">
            <label for="tema-futbol">Fútbol</label><br>
            <input type="checkbox" id="tema-comics" name="temas" value="Comics">
            <label for="tema-comics">Cómics</label><br>
            <input type="checkbox" id="tema-series" name="temas" value="Series">
            <label for="tema-series">Series</label><br>
            <input type="checkbox" id="tema-musica" name="temas" value="Musica">
            <label for="tema-musica">Música</label><br><br>

            <label for="seccion-album">Sección del Álbum a Completar:</label><br>
            <select id="seccion-album" name="seccion_album" required>
                <option value="">-- Seleccioná una sección --</option>
                <option value="Arqueros">Arqueros</option>
                <option value="Defensores">Defensores</option>
                <option value="Mediocampistas">Mediocampistas</option>
                <option value="Delanteros">Delanteros</option>
                <option value="Legendarias">Figuritas Legendarias</option>
            </select><br><br>

            <label for="id-sesion">ID de Sesión:</label><br>
            <input type="text" id="id-sesion" name="id_sesion" value="100" readonly><br><br>

            <input type="hidden" name="sistema" value="SistemaAlbumWeb-v2">

            <label for="resena">Reseña / Figuritas que me faltan:</label><br>
            <textarea id="resena" name="resena" rows="4" placeholder="Contanos sobre vos..."></textarea><br><br>

            <input type="submit" value="ENVIAR REGISTRO">
            <input type="reset" value="RESTABLECER CAMPOS">

        </form>
    </div>

</body>
</html>
